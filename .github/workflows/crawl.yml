name: FeedWatch Crawl

on:
  schedule:
    # 매시 17분 실행. GitHub 예약 지연을 감안해 약 1시간 안에 새 글을 발견한다.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: feedwatch-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install browser
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Write service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > service_account.json
      - name: Run crawler
        env:
          FEEDWATCH_STORAGE: firestore
          FEEDWATCH_ADMIN_EMAIL: ${{ secrets.FEEDWATCH_ADMIN_EMAIL }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: service_account.json
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FEEDWATCH_CRED_PASSPHRASE: ${{ secrets.FEEDWATCH_CRED_PASSPHRASE }}
          FEEDWATCH_APP_URL: ${{ vars.FEEDWATCH_APP_URL || 'https://kimwj-94.github.io/feedwatch/' }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python -m crawler.main_crawler
