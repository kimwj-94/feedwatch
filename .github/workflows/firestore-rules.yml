name: Deploy Firestore rules

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "tests/firestore.rules.test.mjs"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify security rules in the Firestore emulator
        run: npm run test:rules
      - name: Prepare Firebase service account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/feedwatch-service-account.json"
      - name: Deploy verified rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/feedwatch-service-account.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: npx firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Remove temporary service account file
        if: always()
        run: rm -f "$RUNNER_TEMP/feedwatch-service-account.json"
